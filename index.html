<script type="text/wgsl" id="underwater-wgsl">

struct View {
 eye:vec4f, aim:vec4f, size:vec4f, flags:vec4f,
 school:vec4f, food:vec4f, visitor:vec4f,
 animals:array<vec4f,5>,
};
@group(0) @binding(0) var<uniform> v:View;
@vertex fn vertex(@builtin(vertex_index) i:u32)->@builtin(position) vec4f{
 let p=array<vec2f,3>(vec2f(-1,-1),vec2f(3,-1),vec2f(-1,3));return vec4f(p[i],0,1);
}
fn hash(p:vec2f)->f32{let q=fract(p*vec2f(.1031,.11369));return fract((q.x+q.y)*dot(q+vec2f(13.2,21.1),q.yx));}
fn grad(p:vec2f)->vec2f{
 let a=floor(hash(p)*8.);
 let dir=vec2f(select(-1.,1.,a%2.>=1.),select(-1.,1.,a%4.>=2.));
 if(a>=4.){return dir*.70710678;}
 return vec2f(select(dir.x,0.,a>=2.),select(0.,dir.y,a>=2.));
}
fn noise(p:vec2f)->f32{
 let i=floor(p);let f=fract(p);let u=f*f*f*(f*(f*6.-15.)+10.);
 return mix(mix(dot(grad(i),f),dot(grad(i+vec2f(1,0)),f-vec2f(1,0)),u.x),
 mix(dot(grad(i+vec2f(0,1)),f-vec2f(0,1)),dot(grad(i+1.),f-1.),u.x),u.y);
}
fn bed(p:vec2f)->f32{
 let q=(p.x-16.-sin(p.y*.07)*5.)*.105;let s=v.flags.x;
 if(s==4.){
   let channel=(p.x-5.*sin(p.y*.092))*.105;
   return -3.1-3.7*exp(-channel*channel)+noise(p*.13)*1.75+noise(p*.52)*.35;
 }
 if(s==5.){return -15.4-4.*exp(-q*q)+noise(p*.11)*2.45+noise(p*.36)*.55;}
 return -6.-s*1.35-exp(-q*q)*(4.+s*2.7)+noise(p*.092)*4.+noise(p*.29)*.76;
}
fn ell(p:vec3f,r:vec3f)->f32{return (length(p/r)-1.)*min(r.x,min(r.y,r.z));}
fn box(p:vec3f,b:vec3f)->f32{let z=abs(p)-b;return length(max(z,vec3f(0)))+min(max(z.x,max(z.y,z.z)),0.);}
fn seg(p:vec3f,a:vec3f,b:vec3f)->f32{let q=p-a;let n=b-a;return length(q-n*clamp(dot(q,n)/dot(n,n),0.,1.));}
fn best(a:vec2f,b:vec2f)->vec2f{if(b.x<a.x){return b;}return a;}
fn rot(p:vec2f,a:f32)->vec2f{return vec2f(p.x*cos(a)-p.y*sin(a),p.x*sin(a)+p.y*cos(a));}

// Local coordinates follow the swimmer, so markings bend with its tail.
struct Fish {point:vec3f, variation:f32, enabled:bool,};
fn fishAt(p:vec3f)->Fish{
 let x=p-v.school.xyz;let t=v.eye.w;
 // Leave room in each cell for the full tail sweep, even when the shoal converges.
 let spacing=mix(vec3f(2.46,1.48,2.35),vec3f(2.16,1.04,2.16),v.school.w);
 let cell=floor(x/spacing);let rnd=hash(cell.xz+cell.y*5.);
 let phase=t*1.7+cell.y*1.24+cell.x*.76+cell.z*.52;
 let jitter=vec3f(sin(phase)*.092,sin(phase+rnd*10.)*.095,cos(phase)*.105);
 let swimmer=v.school.xyz+(cell+vec3f(.49,.49,.47))*spacing+jitter;
 var heading=.56+sin(t*.78+cell.z*.69+cell.y*.19)*.60+cell.x*.34;
 if(v.school.w>.001){
   let toward=v.food.xz-swimmer.xz;
   let face=atan2(-toward.y,toward.x+.00001);
   heading+=atan2(sin(face-heading),cos(face-heading))*v.school.w;
 }
 let a=rot((p-swimmer).xz,heading);
 let local=(vec3f(a.x,p.y-swimmer.y,a.y))/mix(.75,1.22,rnd);
 return Fish(local,rnd,rnd>.60 || (v.school.w>.4 && rnd>.40));
}
fn fishShape(f:Fish,t:f32)->f32{
 let q=f.point;
 let bounds=box(q-vec3f(-.13,0,0),vec3f(.69,.32,.29));
 if(bounds>.09){return bounds;}
 let swim=sin(t*8.8+f.variation*13.-q.x*4.);
 let bend=clamp(-q.x,0.,.72);
 let p=vec3f(q.x,q.y,q.z-swim*bend*bend*.59);
 let rounded=select(.175,.204,v.flags.x<1.);
 let body=ell(p,vec3f(.39,rounded,.108));
 let snout=ell(p-vec3f(.302,-.018,0),vec3f(.149,.098,.078));
 let root=ell(p-vec3f(-.347,-.012,0),vec3f(.204,.062,.048));
 let fork=vec3f(p.x+.61-abs(p.y)*.48,abs(p.y)-.108,p.z);
 let tail=ell(fork,vec3f(.146,.105,.024));
 let dorsal=ell(vec3f(p.x+p.y*.47+.15,p.y-.163,p.z),vec3f(.25,.105,.024));
 let anal=ell(vec3f(p.x-p.y*.26+.23,p.y+.139,p.z),vec3f(.15,.071,.024));
 let wing=abs(p.z)-.117;
 let pectoral=ell(vec3f(p.x-.03+wing*.94,p.y+.057+wing*.29,wing),vec3f(.119,.026,.087));
 return min(min(min(body,snout),root),min(min(dorsal,anal),min(pectoral,tail)));
}
fn fishColor(p:vec3f,n:vec3f,sun:vec3f,s:i32)->vec3f{
 let f=fishAt(p);let q=f.point;
 let warm=array<vec3f,4>(vec3f(.83,.71,.38),vec3f(.91,.49,.22),vec3f(.29,.73,.76),vec3f(.64,.55,.83))[s];
 let top=array<vec3f,4>(vec3f(.23,.36,.32),vec3f(.46,.23,.16),vec3f(.075,.29,.43),vec3f(.24,.24,.43))[s];
 let belly=vec3f(.81,.86,.79);
 var skin=mix(mix(belly,warm,smoothstep(-.19,-.046,q.y)),top,smoothstep(.027,.21,q.y));
 let band=1.-smoothstep(.24,.65,abs(sin((q.x+q.y*.28)*23.+.9)));
 if(s==0){skin*=1.-band*.69*(1.-smoothstep(.29,.41,abs(q.x)));}
 if(s==1){skin=mix(skin,vec3f(.71,.83,.68),(.5+.5*sin(q.y*62.+q.x*2.))*smoothstep(.08,.14,abs(q.z))*.54);}
 if(s>1){skin=mix(skin,top,smoothstep(.09,.115,q.y+q.x*.08)*.32);}
 let uv=vec2f(q.x*148.,atan2(q.y,abs(q.z)+.035)*12.);
 let row=floor(uv.y);
 let arc=fract(uv.y)-.5;
 let scaleArc=pow(.5+.5*cos(6.283*(fract(uv.x+row*.5)+arc*arc*.57)),5.);
 skin*=.94+scaleArc*select(0.,.15,v.flags.z>.5);
 let eye=length(vec2f((q.x-.275)*.97,q.y-.046));
 if(q.x>.19 && abs(q.z)>.062){
   skin=mix(skin,vec3f(.81,.70,.40),1.-smoothstep(.044,.056,eye));
   skin=mix(skin,vec3f(.008,.012,.015),1.-smoothstep(.026,.035,eye));
   skin=mix(skin,vec3f(.9,.97,.99),1.-smoothstep(.007,.015,length(vec2f(q.x-.277,q.y-.062))));
 }
 let gill=abs(q.x-.139-(q.y+.046)*(q.y+.046)*2.9);
 skin*=1.-(1.-smoothstep(.007,.021,gill))*smoothstep(.058,.090,abs(q.z))*.44;
 let sheen=pow(max(0.,dot(n,normalize(sun+normalize(v.eye.xyz-p)))),26.);
 return skin*(.68+.38*max(0.,dot(n,sun)))+sheen*vec3f(.36,.43,.39);
}
fn specimenPoint(p:vec3f,entry:vec4f)->vec3f{
 let q=p-entry.xyz;
 let a=.46+sin(v.eye.w*.72+entry.w)*.34;
 let r=rot(q.xz,a);
 return vec3f(r.x,q.y,r.y);
}
fn reefFish(q:vec3f,t:f32,k:i32)->f32{
 var proportions=vec3f(1.,1.,1.);
 if(k==15){proportions=vec3f(1.23,.68,.82);}
 if(k==16){proportions=vec3f(1.19,.88,1.23);}
 if(k==27){proportions=vec3f(.71,.83,.73);}
 let a=q/proportions;
 let q1=vec3f(a.x,a.y,a.z-sin(t*7.4-a.x*5.)*max(-a.x,0.)*.27);
 let body=ell(q1,vec3f(.57,.23,.148));
 let mouth=ell(q1-vec3f(.47,-.042,0),vec3f(.21,.115,.119));
 let tail=ell(vec3f(q1.x+.73-abs(q1.y)*.36,abs(q1.y)-.085,q1.z),vec3f(.187,.15,.028));
 let peduncle=ell(q1+vec3f(.48,.012,0),vec3f(.26,.079,.062));
 let dorsal=ell(vec3f(q1.x+q1.y*.73+.12,q1.y-.242,q1.z),vec3f(.28,.117,.026));
 let side=ell(vec3f(q1.x-.05+(abs(q1.z)-.12)*.9,q1.y+.1,abs(q1.z)-.15),vec3f(.20,.026,.147));
 let barbel=seg(q1,vec3f(.54,-.095,.078),vec3f(.677,-.19,.156))-.015;
 let d=min(min(body,mouth),min(min(tail,peduncle),min(dorsal,side)));
 return select(d,min(d,barbel),k==14);
}
fn crab(q:vec3f,t:f32,snow:bool)->f32{
 let a=vec3f(q.x,q.y,abs(q.z));
 var d=ell(q,vec3f(.36,.19,.45));
 let span=select(.56,1.06,snow);
 for(var i=0;i<4;i++){
   let n=f32(i);let gait=sin(t*4.5+n*1.56+select(0.,3.14,q.z>0.))*.073;
   let root=vec3f(.27-n*.16,-.015,.29);
   let knee=vec3f(.38-n*.23,.09+gait,span*.71);
   let toe=vec3f(.49-n*.31,-.20+gait*.44,span);
   d=min(d,min(seg(a,root,knee)-.050,seg(a,knee,toe)-.033));
 }
 let claw=vec3f(.65,-.015+sin(t*3.)*.034,.48);
 d=min(d,seg(a,vec3f(.19,-.02,.29),claw)-.064);
 d=min(d,ell(a-claw,vec3f(.175,.082,.11)));
 return min(d,seg(a,claw+vec3f(.06,.027,.059),claw+vec3f(.25,.035,.078))-.045);
}
fn shrimp(q:vec3f,t:f32)->f32{
 var d=ell(q,vec3f(.35,.14,.114));
 for(var i=0;i<6;i++){
   let a=f32(i)*.26;
   let center=vec3f(-.22-sin(a)*.43,-.26+cos(a)*.3,0);
   d=min(d,ell(q-center,vec3f(.132-a*.037,.119-a*.036,.109-a*.032)));
 }
 let side=vec3f(q.x,q.y,abs(q.z));
 let fan=ell(side-vec3f(-.674,-.235,.052),vec3f(.139,.041,.116));
 let feeler=seg(side,vec3f(.29,.055,.063),vec3f(.90,.24,.22+sin(t*3.8)*.07))-.014;

const PadContract = (() => {
// MotionPad input layer: reference implementation.
//
// This file is documentation that happens to run. It is not a maintained package and carries
// no API promise. Copy it, rewrite it, or port it to another language; whatever you ship has to
// pass the conformance vectors (`node scripts/run-vectors.mjs path/to/your/pad-input.js`) or, without the kit, selfTest() below.
//
// Three layers, top to bottom. Nothing above the last section touches the DOM.
//   gates (a key is held / a tone is present)
//     -> edge filter  : hop-quantised debounce + one winner per arbitration group
//     -> router       : rest cell filtered, held set, event ids
//     -> your game    : a single entry point, onPadEvent(e)

const ACTIVE_CELLS = [1, 2, 3, 4, 6, 7, 8, 9];
const REST_CELL = 5;

const DETECTION = { dwellS: 0.03, retriggerS: 0.15, releaseHops: 2, hopS48k: 0.0426667, hopS96k: 0.0213333 };
const BUDGET = {
  machineLatencyS: 0.09, perceptionS: 0.20, footTravelS: 0.45, footTravelDiagonalS: 0.60,
  reactionFloorS: 0.75, easyReactionFloorS: 1.50, minCueArcmin: 5,
};

// ---------------------------------------------------------------- grid (pure)
const grid = {
  isActive: (c) => Number.isInteger(c) && c >= 1 && c <= 9 && c !== REST_CELL,
  // active cell -> 0..7, skipping the rest cell; anything else -> -1
  toPadIndex: (c) => (!grid.isActive(c) ? -1 : c < 5 ? c - 1 : c - 2),
  fromPadIndex: (i) => (!Number.isInteger(i) || i < 0 || i > 7 ? 0 : i < 4 ? i + 1 : i + 2),
  row: (c) => Math.floor((c - 1) / 3),
  col: (c) => (c - 1) % 3,
  manhattan: (a, b) => Math.abs(grid.row(a) - grid.row(b)) + Math.abs(grid.col(a) - grid.col(b)),
  // "how many cells does this difficulty use": stance-friendly subsets, not the first N cells
  defaultSubset: (n) => (n <= 3 ? [4, 2, 6] : n === 4 ? [2, 4, 6, 8] : n <= 6 ? [1, 4, 7, 3, 6, 9] : ACTIVE_CELLS.slice()),
  // byColumn splits one player's mat into left/middle/right so two people can share it
  arbitrationGroup: (player, cell, byColumn) => (byColumn ? player * 3 + grid.col(cell) : player),
};

// ---------------------------------------------------------------- edge filter (pure, clock injected)
// update() is called once per HOP, never once per animation frame.
function createEdgeFilter({ channels, groups, dwellS = DETECTION.dwellS, retriggerS = DETECTION.retriggerS, releaseHops = DETECTION.releaseHops }) {
  const n = groups ? groups.length : channels;
  const group = groups ? groups.slice() : new Array(n).fill(0);
  const release = Math.max(1, releaseHops);
  let presentSince, lastDown, fired, suppressed, closedHops;
  function reset() {
    presentSince = new Array(n).fill(-1);
    lastDown = new Array(n).fill(-Infinity);
    fired = new Array(n).fill(false);
    suppressed = new Array(n).fill(false);
    closedHops = new Array(n).fill(0);
  }
  reset();

  function update(present, snr, now) {
    const out = [];
    const candidates = [];
    for (let i = 0; i < n; i++) {
      if (present[i]) {
        closedHops[i] = 0;
        if (presentSince[i] < 0) presentSince[i] = now;
        if (!fired[i] && !suppressed[i] && now - presentSince[i] >= dwellS && now - lastDown[i] >= retriggerS) candidates.push(i);
      } else {
        presentSince[i] = -1; // every closed hop resets dwell: a flickering gate never fires
        if (fired[i] || suppressed[i]) {
          if (++closedHops[i] >= release) {
            if (fired[i]) out.push({ ch: i, kind: 'up', snr: snr[i] });
            fired[i] = false; suppressed[i] = false; closedHops[i] = 0;
          }
        }
      }
    }
    // One winner per group; strict > means the lower channel index wins a tie. Scanning forward from k is enough:
    // every earlier candidate of this group was already marked fired or suppressed by the iteration that handled it.
    for (let k = 0; k < candidates.length; k++) {
      const c = candidates[k];
      if (fired[c] || suppressed[c]) continue;
      let winner = c;
      for (let j = k + 1; j < candidates.length; j++) {
        const o = candidates[j];
        if (group[o] === group[c] && snr[o] > snr[winner]) winner = o;
      }
      fired[winner] = true; lastDown[winner] = now;
      out.push({ ch: winner, kind: 'down', snr: snr[winner] });
      for (const o of candidates) {
        if (o === winner || group[o] !== group[c] || fired[o] || suppressed[o]) continue;
        suppressed[o] = true; // stays suppressed until ITS gate closes for releaseHops; never gets a down or an up
        out.push({ ch: o, kind: 'conflict', snr: snr[o] });
      }
    }
    return out;
  }
  // for a debug panel: everything the filter knows about one channel
  const snapshot = (ch, now) => ({ dwellS: presentSince[ch] < 0 ? 0 : now - presentSince[ch], fired: fired[ch], suppressed: suppressed[ch], closedHops: closedHops[ch] });
  return { update, reset, snapshot, isHeld: (ch) => fired[ch], channelCount: n };
}

// ---------------------------------------------------------------- router (pure)
// The guard order below is the contract. In particular: held is updated BEFORE the event is
// emitted, so inside a down callback isHeld(e.cell) is always true.
function createRouter() {
  const held = new Set(); // "player:cell"
  const listeners = [];
  let nextId = 1;
  const key = (p, c) => p + ':' + c;
  function emit(e) {
    for (const fn of listeners.slice()) {
      try { fn(e); } catch (err) { console.error(err); } // one broken listener must not deafen the pad
    }
  }
  const make = (kind, player, cell, source, t, snr, extra) => ({ id: nextId++, kind, player, cell, source, t, snr, conflict: false, reject: null, ...extra });

  return {
    on(fn) { listeners.push(fn); return () => { const i = listeners.indexOf(fn); if (i >= 0) listeners.splice(i, 1); }; },
    down(player, cell, source, snr, t) {
      const e = make('down', player, cell, source, t, snr); // the id is spent before the guards
      if (!grid.isActive(cell)) { e.kind = 'rejected'; e.reject = 'rest'; emit(e); return; }
      if (held.has(key(player, cell))) return; // already held: completely silent
      held.add(key(player, cell)); // held first ...
      emit(e); // ... then the event
    },
    up(player, cell, source, t) {
      if (!held.delete(key(player, cell))) return; // not held: silent, and no id is spent
      emit(make('up', player, cell, source, t, 0));
    },
    conflict(player, cell, source, snr, t) {
      emit(make('rejected', player, cell, source, t, snr, { conflict: true, reject: 'conflict' })); // held untouched
    },
    releaseAll(source, t) {
      for (const k of Array.from(held)) { const [p, c] = k.split(':').map(Number); this.up(p, c, source, t); }
    },
    isHeld: (cell, player = 0) => held.has(key(player, cell)),
    get heldCount() { return held.size; },
  };
}

// ---------------------------------------------------------------- hop clock (pure)
// Turns irregular frame times into hop boundaries. A stalled frame yields every hop it missed,
// each stamped with its own boundary time, so "releaseHops = 2" keeps meaning two HOPS.
function createHopClock(hopS = DETECTION.hopS48k) {
  let last = null, acc = 0;
  return {
    advance(now) {
      if (last === null) { last = now; return []; }
      acc += now - last; last = now;
      const m = Math.floor(acc / hopS + 1e-9);
      acc -= m * hopS;
      const times = [];
      for (let j = 0; j < m; j++) times.push(now - acc - (m - 1 - j) * hopS);
      return times;
    },
    reset() { last = null; acc = 0; },
  };
}

// ---------------------------------------------------------------- the stack: gates -> filter -> router
function createPadInput({ players = 1, byColumn = false, hopS = DETECTION.hopS48k, source = 'simulated' } = {}) {
  const channels = [];
  for (let p = 0; p < players; p++) for (const cell of ACTIVE_CELLS) channels.push({ player: p, cell });
  const groups = channels.map((ch) => grid.arbitrationGroup(ch.player, ch.cell, byColumn));
  const filter = createEdgeFilter({ groups });
  const router = createRouter();
  const clock = createHopClock(hopS);
  // A gate remembers WHEN it opened and closed. A stalled frame replays hop boundaries that lie in the past; a
  // boundary from before the key went down must see a closed gate, exactly as a hop of audio recorded before the
  // foot landed hears nothing. Without this a down can appear less than one hop after the press.
  const openAt = new Array(channels.length).fill(Infinity);
  const closeAt = new Array(channels.length).fill(Infinity);
  const level = new Array(channels.length).fill(0);
  const present = new Array(channels.length).fill(false);
  const snr = new Array(channels.length).fill(0);
  const index = (player, cell) => player * ACTIVE_CELLS.length + grid.toPadIndex(cell);
  let lastTick = null;

  return {
    router, filter, channels,
    on: (fn) => router.on(fn),
    isHeld: (cell, player = 0) => router.isHeld(cell, player),
    // The rest cell has no gate at all: opening it produces nothing, not even a rejected event.
    // atS: when it happened, on the same clock as tick(). Omit it and the change applies to every hop from now on.
    setGate(player, cell, open, strength = 10, atS = -Infinity) {
      if (!grid.isActive(cell) || player >= players) return;
      const i = index(player, cell);
      if (open) { openAt[i] = atS; closeAt[i] = Infinity; level[i] = strength; } else if (closeAt[i] === Infinity && openAt[i] !== Infinity) closeAt[i] = atS;
      if (!open && atS === -Infinity) { openAt[i] = Infinity; closeAt[i] = Infinity; }
    },
    closeAllGates() { openAt.fill(Infinity); closeAt.fill(Infinity); },
    // Call once per animation frame with a monotonic time in seconds.
    tick(now) {
      // No frame for over 2 s and nobody said "hidden": the page stopped painting. That is a lost source, not a stall.
      if (lastTick !== null && now - lastTick > 2.0) this.releaseAll(now);
      lastTick = now;
      for (const hopTime of clock.advance(now)) {
        for (let i = 0; i < present.length; i++) {
          present[i] = hopTime >= openAt[i] && hopTime < closeAt[i];
          snr[i] = present[i] ? level[i] : 0;
          if (hopTime >= closeAt[i]) { openAt[i] = Infinity; closeAt[i] = Infinity; }
        }
        for (const tr of filter.update(present, snr, hopTime)) {
          const { player, cell } = channels[tr.ch];
          if (tr.kind === 'down') router.down(player, cell, source, tr.snr, hopTime);
          else if (tr.kind === 'up') router.up(player, cell, source, hopTime);
          else router.conflict(player, cell, source, tr.snr, hopTime);
        }
      }
    },
    // Input source lost (blur, hidden tab): drop everything AND restart the hop clock, or the return replays every missed hop.
    releaseAll(now) { this.closeAllGates(); filter.reset(); clock.reset(); router.releaseAll(source, now); },
    resetClock() { clock.reset(); },
  };
}

// ---------------------------------------------------------------- keyboard stand-in (the only DOM code)
// e.code, never e.key: the mapping is physical key positions, so it survives AZERTY and Dvorak.
const KEYMAP_P1 = {
  KeyQ: 1, KeyW: 2, KeyE: 3, KeyA: 4, KeyS: 5, KeyD: 6, KeyZ: 7, KeyX: 8, KeyC: 9,
  Digit1: 1, Digit2: 2, Digit3: 3, Digit4: 4, Digit5: 5, Digit6: 6, Digit7: 7, Digit8: 8, Digit9: 9,
  Numpad7: 1, Numpad8: 2, Numpad9: 3, Numpad4: 4, Numpad5: 5, Numpad6: 6, Numpad1: 7, Numpad2: 8, Numpad3: 9,
};
const KEYMAP_P2 = { KeyU: 1, KeyI: 2, KeyO: 3, KeyJ: 4, KeyK: 5, KeyL: 6, KeyM: 7, Comma: 8, Period: 9 };

function bindKeyboard(pad, { target = window, doc = document, playerTwo = false, now = () => performance.now() / 1000 } = {}) {
  const pressed = new Map(); // code -> [player, cell]; several keys may hold one cell open
  const lookup = (code) => (code in KEYMAP_P1 ? [0, KEYMAP_P1[code]] : playerTwo && code in KEYMAP_P2 ? [1, KEYMAP_P2[code]] : null);
  const typing = (el) => el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
  const stillOpen = (player, cell) => { for (const [p, c] of pressed.values()) if (p === player && c === cell) return true; return false; };

  function onDown(e) {
    if (e.repeat) return; // OS auto-repeat would turn "held" into "stepping"
    if (e.metaKey || e.ctrlKey || e.altKey || typing(e.target)) return;
    const hit = lookup(e.code); if (!hit) return;
    e.preventDefault();
    pressed.set(e.code, hit); pad.setGate(hit[0], hit[1], true, 10, now());
  }
  function onUp(e) {
    const hit = pressed.get(e.code); if (!hit) return; // always close, even if the keydown was swallowed
    pressed.delete(e.code);
    if (!stillOpen(hit[0], hit[1])) pad.setGate(hit[0], hit[1], false, 0, now());
  }
  function dropAll() { pressed.clear(); pad.releaseAll(now()); } // otherwise a cell stays held forever
  const onVis = () => { if (doc.hidden) dropAll(); };

  target.addEventListener('keydown', onDown);
  target.addEventListener('keyup', onUp);
  target.addEventListener('blur', dropAll);
  doc.addEventListener('visibilitychange', onVis);
  return () => {
    target.removeEventListener('keydown', onDown); target.removeEventListener('keyup', onUp);
    target.removeEventListener('blur', dropAll); doc.removeEventListener('visibilitychange', onVis);
  };
}

// ---------------------------------------------------------------- self test (no files, no network)
// A pocket version of the conformance vectors for when the vector runner is not at hand:
//   import { selfTest } from './pad-input.js'; selfTest();      // logs PASS/FAIL lines, returns true when all pass
function selfTest(log = console.log) {
  const H = DETECTION.hopS48k;
  let ok = true;
  const check = (name, cond) => { log(`${cond ? 'PASS' : 'FAIL'} selfTest.${name}`); if (!cond) ok = false; };
  const kinds = (xs) => xs.map((x) => x.kind + x.ch).join(' ');

  let f = createEdgeFilter({ groups: [0] });
  check('dwell-then-one-down', kinds(f.update([true], [10], 0)) === '' && kinds(f.update([true], [10], H)) === 'down0' && kinds(f.update([true], [10], 3)) === '');
  check('two-closed-hops-to-release', kinds(f.update([false], [0], 3 + H)) === '' && kinds(f.update([false], [0], 3 + 2 * H)) === 'up0');

  f = createEdgeFilter({ groups: [0] });
  f.update([true], [9], 0); f.update([true], [9], 0.04); f.update([false], [0], 0.06); f.update([false], [0], 0.08); f.update([true], [9], 0.10);
  check('retrigger-blocks-fast-repress', kinds(f.update([true], [9], 0.14)) === '' && kinds(f.update([true], [9], 0.20)) === 'down0');

  f = createEdgeFilter({ groups: [0, 0] });
  f.update([true, true], [9, 14], 0);
  const arb = f.update([true, true], [9, 14], 0.05);
  check('one-winner-per-group', arb.length === 2 && arb.some((x) => x.kind === 'down' && x.ch === 1) && arb.some((x) => x.kind === 'conflict' && x.ch === 0) && !f.isHeld(0));

  f = createEdgeFilter({ groups: [0, 2] });
  f.update([true, true], [9, 14], 0);
  check('column-groups-both-fire', kinds(f.update([true, true], [9, 14], 0.05)) === 'down0 down1');

  f = createEdgeFilter({ groups: [0] });
  const seq = [];
  for (let k = 0; k <= 80; k++) { const open = !(k >= 71 && k <= 77); for (const x of f.update([open], [open ? 10 : 0], k * H)) seq.push(x.kind); }
  check('dropout-looks-like-up-then-down', seq.join(' ') === 'down up down');

  const r = createRouter(); const seen = [];
  r.on((e) => seen.push([e.kind, e.cell, r.isHeld(e.cell, e.player), e.reject || '']));
  r.down(0, 2, 'test', 9, 1); r.down(0, 2, 'test', 9, 1.5); r.down(0, 5, 'test', 0, 2); r.conflict(0, 7, 'test', 8, 2); r.up(0, 4, 'test', 3); r.up(0, 2, 'test', 3);
  check('router-guard-order', JSON.stringify(seen) === JSON.stringify([['down', 2, true, ''], ['rejected', 5, false, 'rest'], ['rejected', 7, false, 'conflict'], ['up', 2, false, '']]));

  const c = createHopClock(H); c.advance(0); c.advance(0.05);
  const hops = c.advance(1.05);
  check('stalled-frame-replays-every-hop', hops.length === 23 && Math.abs(hops[1] - hops[0] - H) < 1e-9 && hops[22] <= 1.05);

  const pad = createPadInput(); const evs = [];
  pad.on((e) => evs.push(e)); pad.setGate(0, 5, true); pad.setGate(0, 2, true);
  for (let t = 0; t <= 0.2; t += 1 / 60) pad.tick(t);
  check('stack-down-after-one-to-two-hops', evs.length === 1 && evs[0].kind === 'down' && evs[0].cell === 2 && evs[0].t >= H - 1e-6 && evs[0].t <= 2 * H + 1e-6);

  // a stalled frame replays boundaries from BEFORE the press: they must not count towards the dwell
  const late = createPadInput(); const lateEvs = [];
  late.on((e) => lateEvs.push(e)); late.tick(0); late.tick(0.01);
  late.setGate(0, 4, true, 10, 0.30);           // pressed at 0.30 s, but the next frame only arrives at 0.31 s
  late.tick(0.31); for (let t = 0.31; t <= 0.5; t += 1 / 60) late.tick(t);
  check('replayed-hops-before-the-press-do-not-count', lateEvs.length === 1 && lateEvs[0].t - 0.30 >= H - 1e-6 && lateEvs[0].t - 0.30 <= 2 * H + 1e-6);
  return ok;
}

return {ACTIVE_CELLS,createEdgeFilter,createRouter};
})();

'use strict';

const PAD_FREQUENCIES = {
  A:[18000,18800,19500,20000,21000,23000,22000,21500],
  B:[18250,23500,24000,25000,28800,30510,32768,34500]
};

function createToneDetector(rate, frequencies) {
  const size=4096, hop=size/2;
  const buffer=new Float32Array(size), window=new Float64Array(size);
  const real=new Float64Array(size), imag=new Float64Array(size), power=new Float64Array(hop);
  const reverse=new Uint16Array(size), cos=new Float64Array(hop), sin=new Float64Array(hop);
  for(let i=0;i<size;i++){
    window[i]=.5-.5*Math.cos(2*Math.PI*i/(size-1));
    reverse[i]=(reverse[i>>1]>>1)|((i&1)*(size>>1));
  }
  for(let i=0;i<hop;i++){cos[i]=Math.cos(-2*Math.PI*i/size);sin[i]=Math.sin(-2*Math.PI*i/size);}
  const search=frequencies.map(hz=>[
    Math.max(1,Math.ceil((hz-75)*size/rate)),
    Math.min(hop-1,Math.floor((hz+75)*size/rate))
  ]);
  const strengths=new Float64Array(frequencies.length), present=Array(frequencies.length).fill(false);
  let filled=0;
  return {
    reset(){filled=0;present.fill(false);},
    push(samples,onHop){
      for(let n=0;n<samples.length;n++){
        buffer[filled++]=samples[n];
        if(filled!==size) continue;
        for(let i=0;i<size;i++){real[reverse[i]]=buffer[i]*window[i];imag[i]=0;}
        for(let stage=2;stage<=size;stage*=2){
          const half=stage/2, stride=size/stage;
          for(let start=0;start<size;start+=stage)for(let k=0;k<half;k++){
            const a=start+k,b=a+half,w=k*stride;
            const r=cos[w]*real[b]-sin[w]*imag[b], s=sin[w]*real[b]+cos[w]*imag[b];
            real[b]=real[a]-r;imag[b]=imag[a]-s;real[a]+=r;imag[a]+=s;
          }
        }
        for(let i=0;i<hop;i++) power[i]=real[i]*real[i]+imag[i]*imag[i];
        search.forEach(([lo,hi],i)=>{
          let peak=lo;
          for(let k=lo+1;k<=hi;k++) if(power[k]>power[peak]) peak=k;
          let sum=0,count=0;
          for(let k=Math.max(1,peak-18);k<=Math.min(hop-1,peak+18);k++){
            if(Math.abs(k-peak)>3){sum+=power[k];count++;}
          }
          strengths[i]=power[peak]/Math.max(sum/Math.max(1,count),.002);
          present[i]=strengths[i]>=(present[i]?8/1.1:8);
        });
        onHop(present,strengths);
        buffer.copyWithin(0,hop);
        filled=hop;
      }
    }
  };
}

async function startMatCapture(profile, listener, lost) {
  if(!navigator.mediaDevices?.getUserMedia) throw new Error('micError');
  let context,stream,source,processor,muted,closed=false;
  const frequencies=PAD_FREQUENCIES[profile];
  const router=PadContract.createRouter();
  const filter=PadContract.createEdgeFilter({groups:frequencies.map(()=>0)});
  router.on(listener);
  let detector;
  function reset(){
    detector?.reset();
    filter.reset();
    router.releaseAll('microphone',performance.now()/1000);
  }
  function stop(){
    if(closed) return;
    closed=true;
    reset();
    if(processor) processor.onaudioprocess=null;
    source?.disconnect(); processor?.disconnect(); muted?.disconnect();
    stream?.getTracks().forEach(track=>track.stop());
    context?.close().catch(()=>{});
  }
  try{
    const required=profile==='A'?48000:96000;
    context=new AudioContext({sampleRate:required});
    const resume=context.resume();
    resume.catch(()=>{});
    stream=await navigator.mediaDevices.getUserMedia({audio:{
      sampleRate:{ideal:required},channelCount:{ideal:1},
      echoCancellation:false,noiseSuppression:false,autoGainControl:false
    }});
    await resume;
    const actual=stream.getAudioTracks()[0].getSettings().sampleRate;
    // Cell 7 is unused. On Device A, cell 8 at 22 kHz is the highest mapped tone.
    if(context.sampleRate < required || (actual && (profile==='B'?actual<required:actual/2<=22000))){
      throw new Error('micRate');
    }
    detector=createToneDetector(context.sampleRate,frequencies);
    source=context.createMediaStreamSource(stream);
    processor=context.createScriptProcessor(2048,1,1);

 if(!photos.length){const p=document.createElement('p');p.textContent=text('empty');list.append(p);return;}
 for(const item of photos){
   const figure=document.createElement('figure'),image=new Image(),caption=document.createElement('figcaption'),link=document.createElement('a');
   const name=cfg[item.site].name[language];
   image.src=item.image;image.alt=name;image.loading='lazy';link.href=item.image;
   link.download='below-the-tide-'+item.time+'.jpg';link.textContent=text('download');
   caption.append(name+' · '+item.depth+' m',document.createElement('br'),new Date(item.time).toLocaleString(LOCALES[language]),document.createElement('br'),link);
   figure.append(image,caption);list.append(figure);
 }
}
$('photo').onclick=takePhoto;
$('album').onclick=()=>{clearInput();if(document.pointerLockElement)document.exitPointerLock();showPhotos();album.showModal();};

let ambience,audioError=false;
function stopAudio(){
 if(!ambience)return;
 clearInterval(ambience.timer);ambience.ctx.close().catch(()=>{});ambience=null;refreshAudio();
}
async function toggleAudio(){
 if(ambience){stopAudio();return;}
 audioError=false;
 let ctx;
 try{
   ctx=new AudioContext();
   const master=ctx.createGain(),low=ctx.createBiquadFilter();
   master.gain.value=.33;low.type='lowpass';low.frequency.value=440;low.connect(master);master.connect(ctx.destination);
   const buffer=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),samples=buffer.getChannelData(0);
   for(let i=0;i<samples.length;i++)samples[i]=Math.random()*2-1;
   const current=ctx.createBufferSource(),currentFilter=ctx.createBiquadFilter(),currentGain=ctx.createGain();
   current.buffer=buffer;current.loop=true;currentFilter.type='lowpass';currentFilter.frequency.value=115;currentGain.gain.value=.25;
   current.connect(currentFilter).connect(currentGain).connect(low);current.start();
   for(const frequency of [35,51,67]){
     const hum=ctx.createOscillator(),gain=ctx.createGain(),lfo=ctx.createOscillator(),mod=ctx.createGain();
     hum.type='sine';hum.frequency.value=frequency;gain.gain.value=.067;
     lfo.frequency.value=frequency*.006;mod.gain.value=.027;lfo.connect(mod).connect(gain.gain);
     hum.connect(gain).connect(low);hum.start();lfo.start();
   }
   function bubble(at,strength){
     const tone=ctx.createOscillator(),pop=ctx.createBufferSource(),envelope=ctx.createGain(),filter=ctx.createBiquadFilter();
     tone.frequency.setValueAtTime(190+Math.random()*210,at);tone.frequency.exponentialRampToValueAtTime(720+Math.random()*250,at+.23);
     pop.buffer=buffer;filter.type='bandpass';filter.frequency.value=1100;filter.Q.value=2.4;
     tone.connect(envelope);pop.connect(filter).connect(envelope);envelope.connect(master);
     envelope.gain.setValueAtTime(.001,at);envelope.gain.exponentialRampToValueAtTime(strength,at+.13);
     envelope.gain.exponentialRampToValueAtTime(.001,at+.29);tone.start(at);tone.stop(at+.3);pop.start(at+.205,Math.random(),.043);
   }
   function whale(at){
     const voice=ctx.createOscillator(),filter=ctx.createBiquadFilter(),gain=ctx.createGain(),vibrato=ctx.createOscillator(),v=ctx.createGain();
     voice.type='triangle';voice.frequency.setValueAtTime(249,at);voice.frequency.exponentialRampToValueAtTime(403,at+1.2);
     voice.frequency.exponentialRampToValueAtTime(143,at+4.4);
     vibrato.frequency.value=3.1;v.gain.value=7;vibrato.connect(v).connect(voice.frequency);
     filter.type='lowpass';filter.frequency.value=530;voice.connect(filter).connect(gain).connect(master);
     const echo=ctx.createDelay(.8),wet=ctx.createGain();echo.delayTime.value=.46;wet.gain.value=.28;gain.connect(echo).connect(wet).connect(master);
     gain.gain.setValueAtTime(.001,at);gain.gain.exponentialRampToValueAtTime(.14,at+1.35);gain.gain.exponentialRampToValueAtTime(.001,at+4.9);
     voice.start(at);vibrato.start(at);voice.stop(at+5);vibrato.stop(at+5);
   }
   let next=ctx.currentTime+3;
   const timer=setInterval(()=>{
     if(document.hidden)return;
     low.frequency.setTargetAtTime(Math.max(180,535+camera.y*13),ctx.currentTime,.7);
     if(Math.random()<(mode==='goggles'?.72:.43))for(let i=0;i<3;i++)bubble(ctx.currentTime+.04+i*.13,.02+Math.random()*.036);
     if(ctx.currentTime>next){whale(ctx.currentTime+.1);next=ctx.currentTime+16+Math.random()*10;}
   },820);
   ambience={ctx,timer};
   await ctx.resume();refreshAudio();
 }catch{if(ambience)stopAudio();else ctx?.close().catch(()=>{});audioError=true;refreshAudio();}
}
$('sound').onclick=toggleAudio;

function selectTrack(index){
 if(trackUrl)URL.revokeObjectURL(trackUrl);
 trackIndex=index;
 trackUrl=URL.createObjectURL(tracks[index].file);
 musicStatus=null;
 music.src=trackUrl;
 refreshMusic();
}
async function playMusic(){
 if(!tracks.length)return;
 const source=trackUrl;
 musicStatus=null;
 try{await music.play();}
 catch(error){if(source===trackUrl && error.name!=='AbortError')musicStatus='trackError';}
 refreshMusic();
}
function nextTrack(){
 if(!tracks.length)return;
 selectTrack((trackIndex+1)%tracks.length);
 playMusic();
}
$('folder').addEventListener('change',event=>{
 music.pause();
 const collator=new Intl.Collator(undefined,{numeric:true,sensitivity:'base'});
 tracks=Array.from(event.target.files,file=>({file,path:file.webkitRelativePath||file.name}))
   .filter(({file})=>/\.mp3$/i.test(file.name))
   .sort((a,b)=>collator.compare(a.path,b.path));
 event.target.value='';
 if(tracks.length){
   selectTrack(0);playMusic();
 }else{
   music.removeAttribute('src');music.load();
   if(trackUrl)URL.revokeObjectURL(trackUrl);
   trackUrl=null;musicStatus='emptyFolder';refreshMusic();
 }
});
$('play').onclick=()=>{if(music.paused)playMusic();else music.pause();};
$('next').onclick=nextTrack;
for(const event of ['play','pause'])music.addEventListener(event,refreshMusic);
music.addEventListener('ended',nextTrack);
music.addEventListener('error',()=>{if(tracks.length){musicStatus='trackError';refreshMusic();}});

moveTo(0);refreshLanguage();startGPU();

</script>
